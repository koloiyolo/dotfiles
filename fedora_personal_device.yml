---
- name: Perform Fedora maintenance task
  hosts:
    - fedora
  become: true
  roles:
    - fedora/maintenance
  ignore_unreachable: true

- name: Setup Nix package manager
  hosts:
    - fedora
  roles:
    - role: fedora/nix_setup

- name: Install cargo packages
  hosts:
    - all
  roles:
    - cargo_maintenance

- name: Install Fish
  hosts:
    - all
  roles:
    - fish_setup

- name: Ensure Docker is installed
  hosts:
    - fedora
  roles:
    - docker/setup
  ignore_unreachable: true

- name: Setup Helix
  hosts:
    - all
  roles:
    - helix_setup

- name: Setup Zed
  hosts:
    - desktop
  roles:
    - zed_setup
