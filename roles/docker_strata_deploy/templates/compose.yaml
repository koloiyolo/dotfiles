services:
  strata:
    container_name: strata
    image: ghcr.io/niko1221/strata:0.2.23-cuda13
    restart: unless-stopped
    devices:
      - nvidia.com/gpu=all
    ports:
      - "{{ docker_strata_deploy_service_port }}:8080"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    shm_size: 2g
    stop_grace_period: 2m
    volumes:
      - data:/data
    environment:
      FAMILY: "{{ docker_strata_deploy_model }}"
      MODEL: "{{ docker_strata_deploy_quant }}"
      PARALLEL: "1"
      API_KEY: "{{ docker_strata_deploy_api_key }}"
      VISION: "{{ docker_strata_deploy_vision }}"
      CONTEXT: "{{ docker_strata_deploy_context }}"

volumes:
  data:
