---
- name: Download Ollama installer
  ansible.builtin.get_url:
    url: https://ollama.com/install.sh
    dest: /tmp/ollama-install.sh
    mode: "0755"

- name: Remove old Ollama version
  ansible.builtin.file:
    path: "/usr/lib/ollama"
    state: absent
  become: true

- name: Install Ollama
  ansible.builtin.command:
    cmd: /tmp/ollama-install.sh
  args:
    creates: /usr/local/bin/ollama
  register: ollama_install

- name: Copy Modelfile from template
  ansible.builtin.copy:
    src: "templates/"
    dest: "/tmp/"
    mode: "0644"
  loop: "{{ ollama_models }}"

- name: Create Ollama model from Modelfile
  ansible.builtin.command:
    cmd: "ollama create {{ item }} -f /tmp/{{ item }}/Modelfile"
  register: ollama_create
  changed_when: "'successfully created' in ollama_create.stdout or 'created' in ollama_create.stdout"
  loop: "{{ ollama_models }}"
