---
- name: Ensure modules directory is created
  ansible.builtin.file:
    dest: /etc/nixos/modules
    state: directory
    mode: "0755"
  become: true

- name: Add desktop modules
  ansible.builtin.template:
    src: "{{ item }}"
    dest: "/etc/nixos/modules/{{ item }}"
    mode: "0644"
  become: true
  loop:
    - "steam.nix"
