---
- name: Ensure Rust toolchain is installed
  ansible.builtin.command: rustup default stable
  changed_when: true

- name: Ensure Rust toolchain is updated
  ansible.builtin.command: rustup update
  changed_when: true

- name: Install cargo packages
  community.general.cargo:
    name:
      - uv
      - bat
      - eza
      - ripgrep
      - du-dust
      - hyperfine
    state: present
