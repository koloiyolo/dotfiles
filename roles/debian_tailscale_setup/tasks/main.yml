---
- name: Ensure Tailscale forwarding sysctl settings
  become: true
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
    sysctl_file: /etc/sysctl.d/99-tailscale.conf
    reload: true
  loop:
    - { name: "net.ipv4.ip_forward", value: "1" }
    - { name: "net.ipv6.conf.all.forwarding", value: "1" }

- name: Restart Tailscale service
  become: true
  ansible.builtin.systemd:
    name: tailscaled
    enabled: true
    state: started

- name: Start Tailscale VPN
  become: true
  ansible.builtin.command:
    cmd: "tailscale up --advertise-exit-node --advertise-routes={{ ip_prefix }}.0/24 --accept-routes"
  changed_when: false
