---
- name: Ensure Docker service is running
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Ensure Pihole directory exists
  ansible.builtin.file:
    dest: pihole
    state: directory
    mode: "0755"

- name: Copy Pihole configuration file
  ansible.builtin.template:
    src: templates/pihole.toml.j2
    dest: "pihole/{{ item }}"
    mode: "0644"
  become: true
  loop:
    - pihole.toml
    - pihole.bak.toml
  notify: Restart Pihole container

- name: Run PiHole container
  community.docker.docker_container:
    name: "{{ docker_pihole_setup_pihole }}"
    image: "{{ docker_pihole_setup_image }}"
    state: started
    network_mode: host
    restart_policy: always
    ports:
      # DNS Ports
      - "53:53/tcp"
      - "53:53/udp"
      # Default HTTP Port
      - "80:80/tcp"
      # Default HTTPs Port. FTL will generate a self-signed certificate
      - "443:443/tcp"
      # Uncomment the line below if you are using Pi-hole as your DHCP server
      - "67:67/udp"
    env:
      TZ: "Europe/Warsaw"
      FTLCONF_webserver_api_password: "correct horse battery staple"
      FTLCONF_dns_listeningMode: "ALL"
    volumes:
      - ./pihole:/etc/pihole
      - ./pihole_log:/var/log/pihole
    capabilities:
      # See https://docs.pi-hole.net/docker/#note-on-capabilities
      # Required if you are using Pi-hole as your DHCP server, else not needed
      - NET_ADMIN
      # Required if you are using Pi-hole as your NTP client to be able to set the host's system time
      - SYS_TIME
      # Optional, if Pi-hole should get some more processing time
      - SYS_NICE
    privileged: true
