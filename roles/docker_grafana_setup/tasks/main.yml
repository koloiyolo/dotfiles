---
- name: Ensure Docker service is running
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Create config directories
  ansible.builtin.file:
    dest: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - alloy
    - grafana/provisioning/datasources/
    - mimir

- name: Copy Alloy config
  ansible.builtin.template:
    src: templates/alloy.hcl.j2
    dest: alloy/config.alloy
    mode: "0644"
    force: true

- name: Copy Mimir config
  ansible.builtin.copy:
    src: templates/mimir.yml
    dest: mimir/config.yml
    mode: "0644"
    force: true

- name: Setup data sources in Grafana
  ansible.builtin.template:
    src: templates/datasources/monitoring.yml.j2
    dest: grafana/provisioning/datasources/monitoring.yml
    mode: "0644"
    force: true

- name: Create Grafana network
  community.docker.docker_network:
    name: grafana_network

- name: Run Grafana Alloy
  community.docker.docker_container:
    name: "{{ docker_grafana_setup_alloy_container }}"
    image: grafana/alloy:latest
    state: started
    restart_policy: always
    networks:
      - name: grafana_network
    ports:
      - "12345:12345"
    volumes:
      - ./alloy:/etc/alloy
    command: >
      run --server.http.listen-addr=0.0.0.0:12345
      /etc/alloy/config.alloy

- name: Run Mimir
  community.docker.docker_container:
    name: "{{ docker_grafana_setup_mimir_container }}"
    image: grafana/mimir:latest
    command: -target=all -config.file=/etc/mimir/config.yml
    state: started
    restart_policy: always
    networks:
      - name: grafana_network
    ports:
      - "9009:9009"
    volumes:
      - ./mimir:/etc/mimir

- name: Run Loki
  community.docker.docker_container:
    name: "{{ docker_grafana_setup_loki_container }}"
    image: grafana/loki:latest
    state: started
    restart_policy: always
    networks:
      - name: grafana_network
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml

- name: Run Grafana
  community.docker.docker_container:
    name: "{{ docker_grafana_setup_grafana_container }}"
    image: grafana/grafana:latest
    state: started
    restart_policy: always
    networks:
      - name: grafana_network
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "3000:3000"

- name: Restart docker
  become: true
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: restarted
