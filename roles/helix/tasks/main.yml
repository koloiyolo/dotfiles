---
- name: Ensure Helix config directory exists
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.config/helix"
    state: directory
    mode: "0755"

- name: Copy Helix config file to .config directory
  ansible.builtin.copy:
    src: templates/
    dest: "{{ ansible_env.HOME }}/.config/helix/"
    mode: "0655"
