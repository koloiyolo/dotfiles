---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Ensure system and packages are updated
  ansible.builtin.apt:
    name: "*"
    state: latest
    update_cache: true

- name: Install basic packages
  ansible.builtin.apt:
    name:
      - fzf
      - fastfetch
      - git
      - curl
      - rustup
      - zoxide
      - fish
      - ripgrep
      - clangd
      - build-essential
      - libssl-dev
      - hx
    state: present
