---
- name: Ensure the fish .config directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/.config/fish/"
    state: directory
    mode: "0755"

- name: Copy configuration file to the fish .config directory
  ansible.builtin.copy:
    src: templates/
    dest: "{{ ansible_facts.env.HOME }}/.config/fish/"
    mode: "0655"

- name: Ensure .env file exists in home directory
  ansible.builtin.copy:
    dest: "{{ ansible_facts.env.HOME }}/.env"
    content: ""
    mode: "0644"
    force: false

- name: Ensure Fish is the default shell for current user
  become: true
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    shell: /usr/bin/fish
