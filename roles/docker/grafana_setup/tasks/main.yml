---
- name: Ensure Docker service is running
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Create config directories
  ansible.builtin.file:
    dest: "{{ grafana_setup_project }}/{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "grafana/provisioning/datasources/"
    - "mimir"
    - "loki"
    - "tempo"

- name: Create Grafana data directory
  ansible.builtin.file:
    dest: "{{ grafana_setup_project }}/data/{{ item.path }}"
    state: directory
    mode: "0755"
    owner: "{{ item.uid }}"
    group: "{{ item.gid }}"
  become: true
  loop:
    - path: grafana
      uid: 472
      gid: 472
    - path: loki
      uid: 10001
      gid: 10001
    - path: tempo
      uid: 10001
      gid: 10001
    - path: mimir
      uid: 10001
      gid: 10001

- name: Copy Mimir config
  ansible.builtin.template:
    src: templates/mimir.yaml
    dest: "{{ grafana_setup_project }}/mimir/config.yaml"
    mode: "0644"
    force: true

- name: Copy Loki config
  ansible.builtin.template:
    src: templates/loki.yaml
    dest: "{{ grafana_setup_project }}/loki/config.yaml"
    mode: "0644"
    force: true

- name: Copy Tempo config
  ansible.builtin.template:
    src: templates/tempo.yaml
    dest: "{{ grafana_setup_project }}/tempo/config.yaml"
    mode: "0644"
    force: true

- name: Setup data sources in Grafana
  ansible.builtin.template:
    src: templates/datasources/monitoring.yaml
    dest: "{{ grafana_setup_project }}/grafana/provisioning/datasources/monitoring.yaml"
    mode: "0644"
    force: true

- name: Copy Grafna LGTM docker compose
  ansible.builtin.template:
    src: templates/docker-compose.yaml
    dest: "{{ grafana_setup_project }}/docker-compose.yaml"
    mode: "0644"
    force: true

- name: Run grafana stack
  community.docker.docker_compose_v2:
    project_src: "{{ grafana_setup_project }}"
    state: present
    recreate: always
