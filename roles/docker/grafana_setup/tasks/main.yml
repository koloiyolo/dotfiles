---
- name: Ensure Docker service is running
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Create config directories
  ansible.builtin.file:
    dest: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ grafana_setup_project }}/grafana_data"
    - "{{ grafana_setup_project }}/grafana/provisioning/datasources/"
    - "{{ grafana_setup_project }}/mimir"
    - "{{ grafana_setup_project }}/loki"

- name: Create Grafana data directory
  ansible.builtin.file:
    dest: "{{ grafana_setup_project }}/grafana_data"
    state: directory
    mode: "0755"
    owner: 472
    group: 472
  become: true

- name: Copy Mimir config
  ansible.builtin.template:
    src: templates/mimir.yml.j2
    dest: "{{ grafana_setup_project }}/mimir/config.yml"
    mode: "0644"
    force: true

- name: Copy Loki config
  ansible.builtin.template:
    src: templates/loki.yml.j2
    dest: "{{ grafana_setup_project }}/loki/config.yml"
    mode: "0644"
    force: true

- name: Setup data sources in Grafana
  ansible.builtin.template:
    src: templates/datasources/monitoring.yml.j2
    dest: "{{ grafana_setup_project }}/grafana/provisioning/datasources/monitoring.yml"
    mode: "0644"
    force: true

- name: Copy Grafna LGTM docker compose
  ansible.builtin.template:
    src: templates/docker-compose.yml
    dest: "{{ grafana_setup_project }}/docker-compose.yml"
    mode: "0644"
    force: true

- name: Run grafana stack
  community.docker.docker_compose_v2:
    project_src: "{{ grafana_setup_project }}"
