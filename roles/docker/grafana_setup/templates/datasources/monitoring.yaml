apiVersion: 1

datasources:
  - name: Mimir
    type: prometheus
    url: "http://{{ grafana_setup_mimir_container }}:9009/prometheus"

  - name: Loki
    type: loki
    url: "http://{{ grafana_setup_loki_container }}:3100"

  - name: Pyroscope
    type: grafana-pyroscope-datasource
    url: "http://{{ grafana_setup_pyroscope_container }}:4040"

  - name: Tempo
    type: tempo
    url: "http://{{ grafana_setup_tempo_container }}:3200"
