---
- name: Ensure Docker service is running
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Create Monitoring directory
  ansible.builtin.file:
    dest: monitoring
    state: directory
    mode: "0755"

- name: Copy docker compose
  ansible.builtin.template:
    src: templates/docker-compose.yml
    dest: monitoring/docker-compose.yml
    mode: "0644"
    force: true

- name: Create Alloy config directory
  ansible.builtin.file:
    dest: monitoring/alloy
    state: directory
    mode: "0755"

- name: Copy Alloy config
  ansible.builtin.template:
    src: templates/alloy.hcl
    dest: monitoring/alloy/config.alloy
    mode: "0644"
    force: true
  notify: Restart Alloy container

- name: Run monitoring stack
  community.docker.docker_compose_v2:
    project_src: monitoring
    state: present
    recreate: always
