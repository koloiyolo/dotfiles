---
- name: Ensure Docker service is running
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Ensure Pihole directory exists
  ansible.builtin.file:
    dest: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ pihole_setup_directory }}"
    - "{{ pihole_setup_directory }}/data"

- name: Copy Pihole configuration file
  ansible.builtin.template:
    src: "templates/{{ item.source }}"
    dest: "{{ pihole_setup_directory }}/{{ item.name }}"
    mode: "0644"
  become: true
  loop:
    - name: data/pihole.toml
      source: pihole.toml.j2
    - name: data/pihole.bak.toml
      source: pihole.toml.j2
    - name: docker-compose.yaml
      source: docker-compose.yaml

- name: Run PiHole container
  community.docker.docker_compose_v2:
    project_src: "{{ pihole_setup_directory }}"
    state: present
    recreate: always
