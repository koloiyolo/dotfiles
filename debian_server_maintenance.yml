---
- name: Perform Debian / Ubuntu maintenance task
  hosts:
    - debian
  become: true
  roles:
    - debian_maintenance
  ignore_unreachable: true

- name: Perform Proxmox maintenance task
  hosts:
    - proxmox
  become: true
  roles:
    - proxmox_maintenance
  ignore_unreachable: true

- name: Setup SSH
  hosts:
    - server
  roles:
    - ssh_setup

- name: Ensure Docker is installed
  hosts:
    - server
  roles:
    - docker_setup

- name: Setup cAdvisor monitoring
  hosts:
    - server
  roles:
    - docker_cadvisor_setup

- name: Setup Fish
  hosts:
    - server
  roles:
    - fish_setup

- name: Setup Helix
  hosts:
    - server
  roles:
    - helix_setup

- name: Install cargo packages
  hosts:
    - server
  roles:
    - cargo_maintenance
