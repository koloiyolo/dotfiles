---
- name: Perform Debian / Ubuntu maintenance task
  hosts:
    - debian
  become: true
  roles:
    - debian/maintenance
  ignore_unreachable: true

- name: Setup Nix package manager
  hosts:
    - debian
  become: true
  roles:
    - nix/setup
  ignore_unreachable: true

- name: Perform Proxmox maintenance task
  hosts:
    - proxmox
  become: true
  roles:
    - proxmox_maintenance
  ignore_unreachable: true

- name: Setup SSH
  hosts:
    - server
  roles:
    - ssh_setup

- name: Ensure Docker is installed
  hosts:
    - server
  roles:
    - docker/setup

- name: Setup server monitoring
  hosts:
    - server
  roles:
    - docker/monitoring_setup

- name: Setup Fish
  hosts:
    - server
  roles:
    - fish_setup

- name: Setup Helix
  hosts:
    - server
  roles:
    - helix_setup

- name: Install cargo packages
  hosts:
    - server
  roles:
    - cargo_maintenance
