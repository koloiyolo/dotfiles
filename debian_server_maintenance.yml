---
- name: Perform Debian / Ubuntu maintenance task
  hosts:
    - debian
  become: true
  roles:
    - debian/maintenance
  ignore_unreachable: true

- name: Perform Proxmox maintenance task
  hosts:
    - proxmox
  become: true
  roles:
    - proxmox_maintenance
  ignore_unreachable: true

- name: Setup SSH
  hosts:
    - server
  roles:
    - ssh_setup

- name: Ensure Docker is installed
  hosts:
    - server
  roles:
    - docker/setup

- name: Setup server monitoring
  hosts:
    - server
  roles:
    - docker/monitoring_setup

- name: Setup Nix package manager
  hosts:
    - debian
  become: true
  roles:
    - nix/install
  ignore_unreachable: true

- name: Setup home-manager
  hosts:
    - all
  roles:
    - nix/home_manager_install
  ignore_unreachable: true

- name: Deploy home via home-manager
  hosts:
    - all
  roles:
    - nix/home_manager_deploy
  ignore_unreachable: true
