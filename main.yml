---
- name: Configure Fedora system
  hosts:
    - fedora
  become: true
  roles:
    - fedora
  ignore_unreachable: true

- name: Install cargo packages
  hosts:
    - fedora
  roles:
    - cargo

- name: Install Fish
  hosts:
    - fedora
  roles:
    - fish

- name: Setup Gnome DE
  hosts:
    - fedora
  roles:
    - gnome

- name: Install and confiigure Docker
  hosts:
    - fedora
  roles:
    - docker
  ignore_unreachable: true

- name: Setup Helix
  hosts:
    - desktop
  roles:
    - helix

- name: Setup Zed
  hosts:
    - desktop
  roles:
    - zed

- name: Setup Ollama
  hosts:
    - desktop
  roles:
    - ollama
